services:
  db:
    image: postgres:15-alpine
    container_name: kingsss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kingsss
      POSTGRES_USER: kingsss
      POSTGRES_PASSWORD: kingsss_dev_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - kingsss_pgdata:/var/lib/postgresql/data

volumes:
  kingsss_pgdata:
